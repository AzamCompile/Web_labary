{% extends 'base.html' %}
{% block content %}

<style>
    body {
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        font-family: Arial, sans-serif;
    }

    h1 {
        text-align: center;
        color: #1e3a8a;
        margin: 25px 0;
        font-size: 34px;
        font-weight: bold;
        letter-spacing: 1px;
    }

    .book-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 25px;
        padding: 30px;
        max-width: 1100px;
        margin: auto;
    }

    .book-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 25px;
        text-align: center;
        box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    .book-card:hover {
        background: #1e3a8a;
        transform: translateY(-8px) scale(1.03);
        box-shadow: 0 12px 30px rgba(30, 58, 138, 0.25);
    }

    .book-card h1 {
        font-size: 20px;
        color: #1e3a8a;
        margin: 0;
        transition: 0.3s;
    }

    .book-card:hover h1 {
        color: white;
    }

    a {
        text-decoration: none;
    }

    p {
        text-align: center;
        font-size: 16px;
        color: #64748b;
    }

    /* create button */
    a[href*="create-author"] {
        display: block;
        width: fit-content;
        margin: 25px auto;
        padding: 10px 22px;
        background: #1e3a8a;
        color: white;
        border-radius: 10px;
        font-weight: bold;
        transition: 0.3s;
        text-decoration: none;
    }

    a[href*="create-author"]:hover {
        background: #0f172a;
        transform: scale(1.05);
    }

</style>

<h1>Category</h1>

<div class="book-grid">
    {% for i in authors %}
        <div class="book-card">
            <div class="book-cover">
                <a href="{% url 'detail_author-books' i.pk %}">
                    <h1>{{ i.name }}</h1>
                </a>
            </div>
        </div>
    {% empty %}
        <p>Hozircha categorya yo‘q</p>
    {% endfor %}
</div>

{% if user.is_superuser %}
    <a href="{% url 'create-author' %}">Create Book</a>
{% endif %}

{% endblock %}
